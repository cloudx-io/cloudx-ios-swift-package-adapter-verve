name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Validate manifest
        run: swift package dump-package
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build and test iOS consumers
        run: |
          destination=$(xcrun simctl list devices available --json | \
            jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) | .value[] | select(.isAvailable)][0].udid // empty')
          if [[ -n "$destination" ]]; then
            xcodebuild test \
              -scheme CloudXVerveAdapter \
              -destination "id=$destination" \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild build-for-testing \
              -scheme CloudXVerveAdapter \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          fi
      - name: Verify artifact checksum
        run: |
          curl --fail --location --output /tmp/CloudXVerveAdapter.xcframework.zip \
            https://github.com/cloudx-io/cloudx-ios-swift-package-adapter-verve/releases/download/binary/3090001.0.0/CloudXVerveAdapter.xcframework.zip
          test "$(swift package compute-checksum /tmp/CloudXVerveAdapter.xcframework.zip)" = \
            "2de58712fac2ac7dc35b2fe49692b8a240cdcea7c82144125111b80286eb4aff"
